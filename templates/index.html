<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineBot - AI Movie Recommender</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
     <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">
             
             <h2>CineBot</h2>
        </div>
        <nav class="tabs">
            <button class="tab-link active" data-tab="text-tab">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                <span>By Description</span>
            </button>
            <button class="tab-link" data-tab="image-tab">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                <span>By Poster</span>
            </button>
        </nav>
        <div class="sidebar-options">
            <h3>Display Options</h3>
            <div class="slider-container">
                <label for="cols-slider">Movies per row</label>
                <div class="slider-wrapper">
                    <input type="range" id="cols-slider" min="1" max="4" value="3">
                    <span id="slider-value">3</span>
                </div>
            </div>
        </div>
        <div class="sidebar-footer">
            <p>Powered By NEO4J</p>
            <hr>
            <p>✍️ JANMAJAY KUMAR</p>
        </div>
    </aside>

    <main class="main-content">
        <header class="main-header">
            <div class="marquee-container">
                 <p class="marquee-text">This app runs on Neo4j Free Tier and public APIs — Performance may vary!!</p>
            </div>
            <h1>Discover Your Next Favorite Movie</h1>
            <p class="subtitle">Use natural language or a poster image to get AI-powered recommendations.</p>
        </header>
        
        <div id="text-tab" class="tab-content active">
            <form id="text-recommendation-form">
                <div class="textarea-wrapper">
                    <textarea id="text-query-input" placeholder="Loading an idea..."></textarea>
                    <button type="button" id="inspire-btn" title="Get a new idea">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.06 9.94L12 2l-3.06 7.94c-.2.52-.82.89-1.4.89H2l7.94 4.06c.52.2.89.82.89 1.4L9.94 22l4.06-7.94c.2-.52.82-.89 1.4-.89H22l-7.94-4.06c-.52-.2-.89-.82-.89-1.4z"/></svg>
                    </button>
                </div>
                <button type="submit" class="submit-btn">Find Movies</button>
            </form>
        </div>

        <div id="image-tab" class="tab-content">
            <form id="image-recommendation-form">
                <label for="image-uploader" class="file-uploader-label">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                    <span>Click to upload a poster</span>
                    <span id="image-filename" class="filename-display"></span>
                </label>
                <input type="file" id="image-uploader" accept="image/png, image/jpeg, image/jpg">
                <button type="submit" class="submit-btn">Find Similar Movies</button>
            </form>
        </div>

        <div id="status-container"></div>

        <div id="results-container">
             <!-- Initial "Empty State" will be added by JS -->
        </div>

        <footer>
            <p>CineBot - Built with Flask, Neo4j, and OpenAI</p>
        </footer>
    </main>
</body>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</html>
